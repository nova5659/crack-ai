<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="48%" stop-color="#131c3d"/>
      <stop offset="100%" stop-color="#1c0f24"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="36%" r="44%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.58"/>
      <stop offset="45%" stop-color="#7c5cff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#070b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="295" r="270" fill="url(#goldGlow)"/>

  <!-- Geopolitical War-Room Globe Grid -->
  <g stroke="#93c5fd" stroke-width="1.4" fill="none" opacity="0.24">
    <circle cx="300" cy="300" r="175"/>
    <circle cx="300" cy="300" r="215" stroke-dasharray="6 8"/>
    <ellipse cx="300" cy="300" rx="175" ry="62"/>
    <ellipse cx="300" cy="300" rx="175" ry="120"/>
    <ellipse cx="300" cy="300" rx="68" ry="175"/>
    <ellipse cx="300" cy="300" rx="126" ry="175"/>
    <line x1="125" y1="300" x2="475" y2="300"/>
    <line x1="300" y1="125" x2="300" y2="475"/>
  </g>

  <!-- Stylized Strategic Continents Silhouette -->
  <g fill="#38bdf8" opacity="0.22">
    <path d="M182 248 Q228 215 282 230 Q320 218 378 242 Q418 265 398 308 Q355 322 332 292 Q292 315 256 298 Q220 330 186 298 Z"/>
    <path d="M235 330 Q278 322 308 354 Q296 396 266 418 Q232 394 235 330 Z"/>
    <path d="M352 336 Q396 328 424 358 Q408 394 374 398 Q344 374 352 336 Z"/>
  </g>

  <!-- Diplomatic / Military Arcs -->
  <g fill="none" stroke-linecap="round">
    <path d="M198 282 Q292 178 396 272" stroke="url(#crimson)" stroke-width="3.2" stroke-dasharray="8 6"/>
    <path d="M254 368 Q336 286 410 348" stroke="#fbbf24" stroke-width="2.4" opacity="0.8"/>
    <circle cx="198" cy="282" r="6" fill="#f43f5e"/>
    <circle cx="396" cy="272" r="6" fill="#fbbf24"/>
    <circle cx="300" cy="252" r="7" fill="#38bdf8"/>
  </g>

  <!-- Imperial Crown & Laurel Crest -->
  <path d="M236 294 L250 232 L280 264 L300 212 L320 264 L350 232 L364 294 Z" fill="url(#gold)" stroke="#fef9c3" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="234" y="300" width="132" height="16" rx="6" fill="url(#gold)"/>
  <circle cx="300" cy="208" r="7" fill="#fef08a"/>
  <circle cx="250" cy="228" r="5" fill="#fef08a"/>
  <circle cx="350" cy="228" r="5" fill="#fef08a"/>

  <!-- Classical Capitol Columns & Horizon -->
  <path d="M0 575 L600 575 L600 800 L0 800 Z" fill="#090c18"/>
  <path d="M110 575 L300 486 L490 575 Z" fill="#131932" stroke="#fbbf24" stroke-width="2.2" opacity="0.9"/>
  <rect x="135" y="575" width="330" height="16" fill="#1e294d"/>
  <g fill="#1c2444" stroke="#64748b" stroke-width="1" opacity="0.85">
    <rect x="160" y="591" width="24" height="120"/>
    <rect x="218" y="591" width="24" height="120"/>
    <rect x="276" y="591" width="48" height="120" fill="#0e1429"/>
    <rect x="358" y="591" width="24" height="120"/>
    <rect x="416" y="591" width="24" height="120"/>
  </g>
  <rect x="115" y="711" width="370" height="14" fill="#fbbf24" opacity="0.35"/>

  <!-- Subtle Floating Stars -->
  <g fill="#fef08a" opacity="0.78">
    <circle cx="96" cy="116" r="2.5"/><circle cx="508" cy="144" r="3"/>
    <circle cx="132" cy="430" r="2"/><circle cx="478" cy="410" r="2.5"/>
  </g>
</svg>
